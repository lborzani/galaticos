# Produção: HTTPS → PocketBase (app + API) ; PocketBase → sidecar de push (rede interna).
# HTTPS de um destes jeitos:
#   Caddy (porta 80/443 no servidor): docker compose --profile caddy up -d --build
#   Tailscale Funnel (sem abrir porta): docker compose up -d --build && tailscale funnel --bg 8090
# Uso: cd deploy && cp .env.example .env && (edite) && um dos comandos acima
name: galaticos

services:
  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  app:
    build: { context: .., target: app }
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"] # só localhost: para o Tailscale Funnel e acesso local
    env_file: .env
    environment:
      APP_URL: https://${DOMAIN}
      PUSH_URL: http://push:8098
      TZ: America/Sao_Paulo
    volumes:
      - pb_data:/pb_data

  push:
    build: { context: .., target: push }
    restart: unless-stopped
    env_file: .env

volumes:
  pb_data:
  caddy_data:
  caddy_config:
